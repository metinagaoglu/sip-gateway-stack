#!KAMAILIO
#
# Kamailio - Örnek Yapılandırma Dosyası
# PostgreSQL, Redis ve FreeSWITCH Entegrasyonu için
#

####### Global Parameters #########

# Loglama seviyesi (2=info, 3=debug)
debug=2
# Arka planda çalış (daemon)
fork=yes
# Kullanılacak alt süreç (worker) sayısı
children=8

# Hata loglarını stderr yerine syslog'a gönder
log_stderror=no
# Syslog facility
log_facility=LOG_LOCAL0

# IP adreslerini ve portları otomatik algıla
auto_aliases=yes
listen=udp:0.0.0.0:5060

####### Defines - Değişkenler #########

#!define WITH_POSTGRES
#!define WITH_REDIS
#!define WITH_AUTH
#!define WITH_USRLOC

# Veritabanı Bağlantı Bilgisi
#!ifdef WITH_POSTGRES
    #!define DBURL "postgres://kamailio:kamailio@postgres:5432/kamailio"
#!endif

# Redis Bağlantı Bilgisi
#!ifdef WITH_REDIS
    #!define REDIS_SERVER "name=redis;addr=redis;port=6379;db=0"
#!endif

# FreeSWITCH Bağlantı Bilgisi
#!define FREESWITCH_IP "freeswitch"
#!define FREESWITCH_PORT "5060"

####### Modules Section #########

# ÖNEMLI: Modül yükleme sırası kritik!
# tm modülü diğer modüllerden ÖNCE yüklenmelidir

# --- Temel Modüller (İlk olarak yüklenmeli) ---
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"

# --- NAT Traversal ---
loadmodule "nathelper.so"

# --- Veritabanı Modülleri ---
#!ifdef WITH_POSTGRES
    loadmodule "db_postgres.so"
#!endif

# --- Kimlik Doğrulama ---
#!ifdef WITH_AUTH
    loadmodule "auth.so"
    loadmodule "auth_db.so"
#!endif

# --- Kullanıcı Konum Modülleri ---
#!ifdef WITH_USRLOC
    loadmodule "usrloc.so"
    loadmodule "registrar.so"
#!endif

# --- Redis Modülü ---
#!ifdef WITH_REDIS
    loadmodule "ndb_redis.so"
#!endif

####### Module Parameters #########

# ----- tm params -----
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)

# ----- rr params -----
modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 0)

# ----- auth_db params -----
#!ifdef WITH_AUTH
modparam("auth_db", "db_url", DBURL)
modparam("auth_db", "calculate_ha1", 1)
modparam("auth_db", "password_column", "password")
modparam("auth_db", "load_credentials", "")
modparam("auth_db", "use_domain", 0)
modparam("auth_db", "version_table", 0)
#!endif

# ----- usrloc params -----
#!ifdef WITH_USRLOC
modparam("usrloc", "db_url", DBURL)
modparam("usrloc", "db_mode", 2)
modparam("usrloc", "use_domain", 0)
modparam("usrloc", "matching_mode", 0)
#!endif

# ----- registrar params -----
#!ifdef WITH_USRLOC
modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_expires", 3600)
modparam("registrar", "min_expires", 60)
#!endif

# ----- redis params -----
#!ifdef WITH_REDIS
modparam("ndb_redis", "server", REDIS_SERVER)
#!endif

####### Routing Logic #########

request_route {
    # 1. Başlangıç kontrolleri
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (!sanity_check("1511", "7")) {
        xlog("L_ERR", "Malformed SIP message from $si:$sp\n");
        exit;
    }

    # 2. NAT Yönetimi
    force_rport();
    if (nat_uac_test("19")) {
        fix_nated_contact();
    }

    # 3. Yönlendirme Öncesi İşlemler
    if (!is_method("REGISTER")) {
        record_route();
    }

    # 4. Kimlik Doğrulama ve Kayıt İşlemleri
    if (is_method("REGISTER")) {
        #!ifdef WITH_USRLOC
            # Kimlik doğrulama şimdilik devre dışı
            # Üretimde mutlaka aktif edilmeli!
            
            if (!save("location")) {
                sl_reply_error();
                exit;
            }
            xlog("L_INFO", "REGISTER successful for $fu from $si:$sp\n");
            exit;
        #!endif
    }

    # 5. Çağrı Yönlendirme Mantığı
    # URI'yi normalize et
    if (uri==myself || uri=~"^sip:[0-9a-zA-Z]+@192\.168\.1\.4") {
        xlog("L_INFO", "Local call from $fu to $ru\n");
        
        #!ifdef WITH_USRLOC
            # Location database'de ara
            if (lookup("location")) {
                xlog("L_INFO", "User found in location DB, routing to $du\n");
                t_on_reply("NAT_REPLY");
                t_relay();
                exit;
            } else {
                xlog("L_WARN", "User $ru not found in location DB\n");
            }
        #!endif
        
        # Kullanıcı bulunamadı
        sl_send_reply("404", "User Not Found");
        exit;
    }

    # Kayıtlı değilse veya dış arama ise FreeSWITCH'e gönder
    xlog("L_INFO", "External call - Forwarding to FreeSWITCH from $fu to $ru\n");
    $du = "sip:freeswitch:5060";
    
    t_on_reply("NAT_REPLY");
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

# Yanıt işleme
onreply_route[NAT_REPLY] {
    xlog("L_INFO", "Reply received: $rs $rr\n");
    
    if (nat_uac_test("19")) {
        fix_nated_contact();
    }
}