#!KAMAILIO
#
# Kamailio 6.0 — SIP proxy + registrar
# Kimlik dogrulama: subscriber tablosu, digest, use_domain=1 (cok kiracilik)
# Yonlendirme: dispatcher (setid 1) -> FreeSWITCH
#

####### Preprocessor #######
# $env(...) substitutionlari ve #!substdef/#!subst her zaman KULLANILDIKLARI
# YERDEN ONCE tanimlanmis olmalidir — kamailio'nun cfg lexer'i dosyayi tek
# gecişte, satir satir isler; bir #!substdef, kendinden ONCEKI satirlara
# geriye donuk uygulanmaz. Bu yuzden bu blok, onlari kullanan `listen=`
# satirindan once, dosyanin en basina konuldu (bkz. rapor: "SELF_IP" duz
# metin olarak kalip `advertise udp:SELF_IP:5060` uretiyordu).
#!substdef "!SELF_IP!$env(EXTERNAL_IP)!g"
#!substdef "!DBURL!$env(DBURL)!g"
#!substdef "!FS_HOST!freeswitch!g"

####### Global #######
debug=2
log_stderror=yes            # docker logs icin
fork=no                     # -DD ile uyumlu
children=4
auto_aliases=no

# Kamailio kendi DNS onbellegini kullandiginda /etc/hosts'u ATLAR. Bu yiginda
# dispatcher hedefi bir hostname ('freeswitch') ve compose o adi kamailio
# konteynerinin /etc/hosts'una sabit IP olarak yaziyor (extra_hosts). Onbellek
# acik kalirsa Kamailio o girdiyi gormez ve BASLANGICTA hedefi cozemez:
#     ERROR pack_dest(): could not resolve freeswitch (missing no-probing flag?!?)
#     WARNING ds_load_db(): unable to add destination ... -- skipping
# Hedef atlandigi icin dispatcher listesi BOS kalir ve butun cagrilar KALICI
# olarak "503 No Media Server Available" alir (flags=8 probing de kurtarmiyor).
# Olculdu: konteyner icinde `getent hosts freeswitch` DOGRU sonuc verirken
# Kamailio ayni adi cozemiyordu — fark tam olarak bu onbellek.
# Kapatinca sistem cozumleyicisi (getaddrinfo, /etc/hosts dahil) kullanilir.
# Regresyon: scripts/verify-94-startup-order.sh
use_dns_cache=0

listen=udp:0.0.0.0:5060 advertise SELF_IP:5060

# ZORUNLU. `advertise` adresi Kamailio'nun "myself" listesine OTOMATIK GIRMEZ
# (auto_aliases=no ile hic girmez). record_route() Record-Route basligina
# advertise adresini (SELF_IP) yazar; dialog ici ACK/BYE geri geldiginde
# loose_route() o Route'un kendisine ait oldugunu ANLAMAZ ve false doner.
# Sonuc, asagidaki request_route dalinda:
#   - ACK  -> `is_method("ACK") { exit; }` ile SESSIZCE ATILIR
#   - BYE  -> "404 Not Here"
# Belirti cok sinsi: FreeSWITCH ACK gelmedigi icin 200 OK'i retransmit eder,
# cagri kurulmus GORUNUR (ses bile akar, cunku RTP ayri bir yoldur), ama
# hicbir zaman duzgun kapanmaz — 32 sn sonra zaman asimiyla duser. CDR'da
# her cagri duration=32, hangup_cause=NORMAL_UNSPECIFIED olarak birikir.
# Gercek softphone'lar da etkilenir: kullanici kapatinca cagri kapanmaz.
# Port yazilmiyor cunku Record-Route'taki URI portsuzdur (`sip:SELF_IP;lr=on`)
# ve portsuz alias her portu kapsar.
alias=SELF_IP

####### Modules #######
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "kex.so"
loadmodule "nathelper.so"
loadmodule "db_postgres.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "dispatcher.so"

####### Module params #######
# nathelper'in fix_nated_register()/fix_nated_contact() fonksiyonlari
# 'received_avp' parametresi ayarlanmadan CALISMAZ; brief'te bu satirlar
# eksikti ve gercek konteynerde (kamailio -c degil, gercek `kamailio -DD`
# ile) "you must set 'received_avp' parameter" -> fix_actions() basarisiz
# -> "error -1 while trying to fix configuration" ile surekli crash-loop'a
# yol aciyordu (kamailio -c bu fixup'i calistirmadigindan sozdizim
# kontrolunde yakalanmiyordu). Iki modulde de AYNI AVP kullanilmali.
modparam("nathelper", "received_avp", "$avp(rcv)")
modparam("registrar", "received_avp", "$avp(rcv)")

modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)

modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 0)

# use_domain=1 -> cok kiracilik: alice@tenant1.voip.local ile
# alice@tenant2.voip.local farkli kullanicilardir.
modparam("auth_db", "db_url", "DBURL")
modparam("auth_db", "calculate_ha1", 0)     # ha1 sutunu seed'de hesaplandi
modparam("auth_db", "password_column", "ha1")
modparam("auth_db", "use_domain", 1)
modparam("auth_db", "load_credentials", "")

modparam("usrloc", "db_url", "DBURL")
modparam("usrloc", "db_mode", 2)            # write-back
modparam("usrloc", "use_domain", 1)

modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_expires", 3600)
modparam("registrar", "min_expires", 60)

modparam("dispatcher", "db_url", "DBURL")
modparam("dispatcher", "table_name", "dispatcher")
modparam("dispatcher", "flags", 2)          # inaktif hedefleri atla
modparam("dispatcher", "ds_ping_interval", 30)
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_ping_method", "OPTIONS")

####### Routing #######
request_route {

    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (!sanity_check("1511", "7")) {
        xlog("L_ERR", "Bozuk SIP mesaji: $si:$sp\n");
        exit;
    }

    # NAT
    force_rport();
    if (nat_uac_test("19")) {
        if (is_method("REGISTER")) {
            fix_nated_register();
        } else {
            fix_nated_contact();
        }
    }

    # Dialog ici istekler (ACK, BYE, re-INVITE)
    if (has_totag()) {
        if (loose_route()) {
            # FreeSWITCH ext-sip-ip=SELF_IP duyurdugu icin Contact'i
            # `sip:...@SELF_IP:5060` olur — yani HOST'ta BIZE publish edilmis
            # adresi. Dialog ici ACK/BYE o Contact'a gelir; loose_route Route'u
            # dogru isler ama RURI bizi gosterdigi icin istek KENDIMIZE
            # yonlenir ve dusurulur.
            # Belirti: cagri kurulur, ses akar (RTP ayri yol), ama hic duzgun
            # kapanmaz — FreeSWITCH ACK almadigi icin 200 OK'i retransmit eder,
            # 32 sn sonra zaman asimiyla duser ve CDR'a
            # duration=32 / NORMAL_UNSPECIFIED olarak yazilir. Gercek
            # softphone'lar da etkilenir.
            # ext-sip-ip'yi FreeSWITCH tarafinda kaldirmak/degistirmek
            # denendi ve olmadi (sebepler internal.xml.tmpl'de); dogru yer
            # burasi: RURI bize aitse istegi medya sunucusuna yonlendir.
            # RURI'ye DOKUNMUYORUZ, yalnizca $du (destination) veriyoruz —
            # boylece FreeSWITCH kendi dialogunu tanimaya devam eder.
            # FS_HOST bir #!substdef'tir, yani DUZ METIN olarak ikame edilir.
            # `"sip:" + FS_HOST + ":5060"` yazmak `... + freeswitch + ...`
            # uretir ve `freeswitch` tanimsiz bir token oldugu icin cfg
            # "syntax error" ile parse edilmez (Kamailio crash-loop'a girer).
            # Ikame string ICINDE de calisir, o yuzden tek parca yaziyoruz.
            if (uri == myself) {
                $du = "sip:FS_HOST:5060";
            }
            t_relay();
            exit;
        }
        # Buraya dusmek NORMAL DEGIL: loose_route() basarisiz oldu, yani
        # Route basligi ya yok ya da bize ait gorunmuyor (bkz. yukarida
        # `alias`). Sessizce cikmak bu hatayi aylarca gizleyebilir, o yuzden
        # logluyoruz.
        xlog("L_WARN", "loose_route basarisiz, dialog ici $rm dusuruldu: "
                       "ruri=$ru route=$hdr(Route) src=$si:$sp\n");
        if (is_method("ACK")) { exit; }
        sl_send_reply("404", "Not Here");
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) { t_relay(); }
        exit;
    }

    if (!is_method("REGISTER")) {
        record_route();
    }

    route(REGISTRAR);
    route(INVITE);
    exit;
}

# --- Kayit ---
route[REGISTRAR] {
    if (!is_method("REGISTER")) return;

    if (!www_authenticate("$fd", "subscriber")) {
        www_challenge("$fd", "0");
        exit;
    }

    if (!save("location")) {
        sl_reply_error();
        exit;
    }
    xlog("L_INFO", "REGISTER ok: $fu ($si:$sp)\n");
    exit;
}

# --- Cagri kurulumu ---
route[INVITE] {
    if (!is_method("INVITE")) return;

    # FreeSWITCH'ten gelen INVITE: kayitli aboneye dogrudan gonder.
    # Bu ayrim olmazsa cagri tekrar dispatcher'a dusup dongu olusur.
    if (src_ip == FS_HOST) {
        if (!lookup("location")) {
            xlog("L_WARN", "Kayitli degil: $ru\n");
            sl_send_reply("404", "User Not Found");
            exit;
        }
        t_relay();
        exit;
    }

    # Abone kaynakli INVITE: once kimlik dogrula
    if (!proxy_authenticate("$fd", "subscriber")) {
        proxy_challenge("$fd", "0");
        exit;
    }
    # Kimlik dogrulandi -> From basligi gercekten bu kullaniciya mi ait?
    # NOT: brief'teki check_from() hicbir yuklu modulde (siputils dahil)
    # mevcut degil -- kamailio -c "failed to find command check_from" ile
    # basarisiz oluyordu. Standart Kamailio deyimi olan $au (proxy_authenticate
    # sonrasi dogrulanan kullanici) / $fU (From basligi kullanicisi)
    # karsilastirmasina gecildi; ek modul gerektirmez.
    if ($au != $fU) {
        sl_send_reply("403", "From Mismatch");
        exit;
    }

    # Dogrulanan Proxy-Authorization basligini iletilen INVITE'tan KALDIR.
    # Bu satir olmadan baslik FreeSWITCH'e kadar gider; mod_sofia, profilde
    # auth-calls=false ve apply-inbound-acl=trusted olmasina RAGMEN istekte
    # bir credential gorurse kendi digest dogrulamasini calistirir. Nonce'u
    # Kamailio uretmis oldugu icin tanimaz ve "stale=true" ile 407 doner;
    # kanal CS_NEW'de kalir, 12 sn sonra "Abandoned / WRONG_CALL_STATE" ile
    # duser. Belirti "cagri hic acilmiyor" seklindedir, sebebi ise burasidir.
    # Kanit ve tek degiskenli bisect icin: tools/sip-call-probe.py
    consume_credentials();

    if (!ds_select_dst("1", "4")) {     # setid 1, round-robin
        sl_send_reply("503", "No Media Server Available");
        exit;
    }
    xlog("L_INFO", "$fu -> $ru, FreeSWITCH: $du\n");

    t_on_failure("FS_FAILOVER");
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

failure_route[FS_FAILOVER] {
    if (t_is_canceled()) { exit; }
    if (t_check_status("5[0-9][0-9]")) {
        if (ds_next_dst()) {
            xlog("L_WARN", "FreeSWITCH failover -> $du\n");
            t_relay();
            exit;
        }
    }
}
