name: voip

services:
  postgres:
    image: postgres:16
    container_name: voip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      FS_DB_NAME: ${FS_DB_NAME}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - voip_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [voip_net]

  kamailio:
    build: ./kamailio
    image: voip-kamailio
    container_name: voip-kamailio
    restart: unless-stopped
    environment:
      DBURL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      EXTERNAL_IP: ${EXTERNAL_IP}
      SIP_DOMAIN: ${SIP_DOMAIN}
    ports:
      - "5060:5060/udp"
    extra_hosts:
      # tenant1.voip.local henuz gercek bir DNS kaydina sahip degil; seed'deki
      # subscriber.ha1 tam olarak bu domain icin hesaplandi (bkz.
      # db/init/02-seed.sql), o yuzden verify-04-register.sh'nin pozitif
      # REGISTER testi bu adi cozebilmeli. Container'a elle /etc/hosts girmek
      # yeniden olusturmada kaybolur; bu satir compose'un parcasi oldugu icin
      # kalicidir.
      - "tenant1.voip.local:127.0.0.1"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [voip_net]

volumes:
  voip_pg_data:

networks:
  voip_net:
    driver: bridge
