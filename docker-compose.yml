name: voip

services:
  postgres:
    image: postgres:16
    container_name: voip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      FS_DB_NAME: ${FS_DB_NAME}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - voip_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [voip_net]

  kamailio:
    build: ./kamailio
    image: voip-kamailio
    container_name: voip-kamailio
    restart: unless-stopped
    environment:
      DBURL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      EXTERNAL_IP: ${EXTERNAL_IP}
      SIP_DOMAIN: ${SIP_DOMAIN}
    ports:
      - "5060:5060/udp"
    extra_hosts:
      # tenant1.voip.local henuz gercek bir DNS kaydina sahip degil; seed'deki
      # subscriber.ha1 tam olarak bu domain icin hesaplandi (bkz.
      # db/init/02-seed.sql), o yuzden verify-04-register.sh'nin pozitif
      # REGISTER testi bu adi cozebilmeli. Container'a elle /etc/hosts girmek
      # yeniden olusturmada kaybolur; bu satir compose'un parcasi oldugu icin
      # kalicidir.
      - "tenant1.voip.local:127.0.0.1"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [voip_net]

  xmlapi:
    build: ./xmlapi
    image: voip-xmlapi
    container_name: voip-xmlapi
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [voip_net]

  freeswitch:
    build: ./freeswitch
    image: voip-freeswitch
    container_name: voip-freeswitch
    restart: unless-stopped
    cap_add:
      - SYS_NICE          # SCHED_FIFO / nice hatasinin giderilmesi
    environment:
      EXTERNAL_IP: ${EXTERNAL_IP}
      SIP_DOMAIN: ${SIP_DOMAIN}
      RTP_START: ${RTP_START}
      RTP_END: ${RTP_END}
      FS_ESL_PASSWORD: ${FS_ESL_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      FS_DB_NAME: ${FS_DB_NAME}
      TRUNK_NAME: ${TRUNK_NAME}
      TRUNK_HOST: ${TRUNK_HOST}
      TRUNK_USER: ${TRUNK_USER}
      TRUNK_PASS: ${TRUNK_PASS}
      TRUNK_REGISTER: ${TRUNK_REGISTER}
      TRUNK_DID: ${TRUNK_DID}
    volumes:
      # autoload_configs ve sip_profiles YAZILABILIR bagli: entrypoint.sh
      # *.tmpl sablonlarini bu dizinlere isleyip yaziyor.
      - ./freeswitch/conf/autoload_configs:/opt/freeswitch/etc/freeswitch/autoload_configs
      - ./freeswitch/conf/sip_profiles:/opt/freeswitch/etc/freeswitch/sip_profiles
      # Sablon icermeyen dizinler salt okunur.
      - ./freeswitch/conf/dialplan:/opt/freeswitch/etc/freeswitch/dialplan:ro
      - ./freeswitch/scripts:/opt/freeswitch/scripts:ro
    ports:
      - "5080:5060/udp"
      - "8021:8021/tcp"
      - "${RTP_START}-${RTP_END}:${RTP_START}-${RTP_END}/udp"
    depends_on:
      postgres:
        condition: service_healthy
      xmlapi:
        condition: service_healthy
    networks: [voip_net]

volumes:
  voip_pg_data:

networks:
  voip_net:
    driver: bridge
    ipam:
      config:
        # Docker'in otomatik atadigi subnet host'a gore degisir (bu makinede
        # 192.168.155.0/24 cikti, 172.16.0.0/12 disinda kaldi). ESL ACL'i
        # (event_socket.conf.xml.tmpl -> acl.conf.xml) 172.16.0.0/12'yi
        # beyaz listeye aliyor; bu subnet'i sabitlemek o kuralin her
        # ortamda gercekten calismasini garantiliyor.
        - subnet: 172.30.0.0/16
