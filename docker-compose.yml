name: voip

services:
  postgres:
    image: postgres:16
    container_name: voip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      FS_DB_NAME: ${FS_DB_NAME}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - voip_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [voip_net]

  kamailio:
    build: ./kamailio
    image: voip-kamailio
    container_name: voip-kamailio
    restart: unless-stopped
    environment:
      DBURL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      EXTERNAL_IP: ${EXTERNAL_IP}
      SIP_DOMAIN: ${SIP_DOMAIN}
    ports:
      - "5060:5060/udp"
    extra_hosts:
      # tenant1.voip.local henuz gercek bir DNS kaydina sahip degil; seed'deki
      # subscriber.ha1 tam olarak bu domain icin hesaplandi (bkz.
      # db/init/02-seed.sql), o yuzden verify-04-register.sh'nin pozitif
      # REGISTER testi bu adi cozebilmeli. Container'a elle /etc/hosts girmek
      # yeniden olusturmada kaybolur; bu satir compose'un parcasi oldugu icin
      # kalicidir.
      - "tenant1.voip.local:127.0.0.1"
      # 'freeswitch' adini Docker DNS'ine BIRAKMIYORUZ: dispatcher yuklemesi
      # baslangicta cozumleme yapar ve FreeSWITCH henuz ayakta degilse hedefi
      # sessizce atlar. /etc/hosts girdisi konteyner ayaga kalkarken hazirdir,
      # yani baslatma sirasi onemsizlesir. Regresyon: verify-94-startup-order.sh
      - "freeswitch:${FS_CONTAINER_IP}"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [voip_net]

  xmlapi:
    build: ./xmlapi
    image: voip-xmlapi
    container_name: voip-xmlapi
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [voip_net]

  freeswitch:
    build: ./freeswitch
    image: voip-freeswitch
    container_name: voip-freeswitch
    restart: unless-stopped
    cap_add:
      - SYS_NICE          # SCHED_FIFO / nice hatasinin giderilmesi
    environment:
      # max_calls.lua bu ikisini okur (freeswitch.Dbh DSN'i).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CODEC_PREFS: ${CODEC_PREFS}
      FS_EXT_SIP_PORT: ${FS_EXT_SIP_PORT}
      TRUNK_ENABLED: ${TRUNK_ENABLED}
      EXTERNAL_IP: ${EXTERNAL_IP}
      SIP_DOMAIN: ${SIP_DOMAIN}
      RTP_START: ${RTP_START}
      RTP_END: ${RTP_END}
      FS_ESL_PASSWORD: ${FS_ESL_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      FS_DB_NAME: ${FS_DB_NAME}
      TRUNK_NAME: ${TRUNK_NAME}
      TRUNK_HOST: ${TRUNK_HOST}
      TRUNK_USER: ${TRUNK_USER}
      TRUNK_PASS: ${TRUNK_PASS}
      TRUNK_REGISTER: ${TRUNK_REGISTER}
      TRUNK_DID: ${TRUNK_DID}
    volumes:
      # autoload_configs ve sip_profiles YAZILABILIR bagli: entrypoint.sh
      # *.tmpl sablonlarini bu dizinlere isleyip yaziyor.
      - ./freeswitch/conf/autoload_configs:/opt/freeswitch/etc/freeswitch/autoload_configs
      - ./freeswitch/conf/sip_profiles:/opt/freeswitch/etc/freeswitch/sip_profiles
      # YAZILABILIR: default.xml.tmpl entrypoint'te islenip default.xml
      # olarak buraya yaziliyor (gateway adi .env'den gomuluyor).
      - ./freeswitch/conf/dialplan:/opt/freeswitch/etc/freeswitch/dialplan
      # Yol FreeSWITCH'in $${script_dir} degeriyle AYNI OLMALI. Bu derlemede
      # script_dir = /opt/freeswitch/share/freeswitch/scripts'tir;
      # /opt/freeswitch/scripts'e baglamak sessizce ise yaramaz — dosya
      # konteynerde gorunur ama `lua <script>` "Cannot execute script" der.
      # Dogrulama: fs_cli -x "global_getvar script_dir"
      - ./freeswitch/scripts:/opt/freeswitch/share/freeswitch/scripts:ro
    ports:
      # ext-sip-port ile AYNI deger olmali (internal.xml.tmpl).
      # Ayri duserlerse FreeSWITCH ulasilamaz bir Contact duyurur ve
      # dialog ici ACK/BYE kaybolur.
      - "${FS_SIP_PORT}:5060/udp"
      # external (trunk) profili. Host portu = KONTEYNER portu olmak ZORUNDA:
      # FreeSWITCH Contact/Via'ya profil portunu yazar ve `ext-sip-port` bu
      # derlemede Contact'i etkilemiyor (internal profilde olculdu). Portlar
      # ayri duserse saglayici geri donen istekleri yanlis yere gonderir.
      - "${FS_EXT_SIP_PORT}:${FS_EXT_SIP_PORT}/udp"
      - "8021:8021/tcp"
      - "${RTP_START}-${RTP_END}:${RTP_START}-${RTP_END}/udp"
    depends_on:
      postgres:
        condition: service_healthy
      xmlapi:
        condition: service_healthy
    networks:
      voip_net:
        # SABIT IP. Kamailio'nun dispatcher hedefi bir hostname ve Kamailio
        # dispatcher'i BASLANGICTA cozmeye calisir; DNS o an hazir degilse
        # hedefi TAMAMEN ATLAR ve bir daha denemez (flags=8 probing bile
        # kurtarmiyor -- olculdu). Sonuc butun cagrilarda kalici 503 olur.
        # Sabit IP + kamailio'da extra_hosts esleme, DNS bagimliligini ve
        # dolayisiyla baslatma sirasi hassasiyetini tamamen ortadan kaldirir.
        ipv4_address: ${FS_CONTAINER_IP}

  web:
    build: ./web
    image: voip-web
    container_name: voip-web
    restart: unless-stopped
    environment:
      # entrypoint sertifikanin SAN'ini bunlardan uretir.
      EXTERNAL_IP: ${EXTERNAL_IP}
      SIP_DOMAIN: ${SIP_DOMAIN}
    volumes:
      # Sertifika KALICI olmali. Her yeniden kurulumda yeniden uretilirse
      # tarayicidaki guvenlik istisnasi gecersizlesir ve kullanici onu elle
      # yeniden kabul etmek zorunda kalir.
      - voip_web_certs:/etc/nginx/certs
    ports:
      # TLS ucu BURADA. Kamailio'nun ws soketi (tcp/8080) host'a publish
      # EDILMEZ; nginx ona voip_net uzerinden ulasir.
      - "${WEB_TLS_PORT}:8443"
    depends_on:
      # nginx `proxy_pass http://kamailio:8080` adresini KONFIGURASYON
      # YUKLENIRKEN cozer (degisken kullanilmadigi icin). Kamailio henuz
      # yoksa nginx "host not found in upstream" ile cikar; restart politikasi
      # onu yeniden baslatir ve ikinci denemede acilir. Bu, ayni sinif DNS
      # sirasi sorununun (bkz. dispatcher/extra_hosts yorumlari) kabul
      # edilebilir bicimidir: hata GURULTULU ve kendiliginden duzelir.
      - kamailio
    networks: [voip_net]

volumes:
  voip_pg_data:
  voip_web_certs:

networks:
  voip_net:
    driver: bridge
    ipam:
      config:
        # Docker'in otomatik atadigi subnet host'a gore degisir (bu makinede
        # 192.168.155.0/24 cikti, 172.16.0.0/12 disinda kaldi). ESL ACL'i
        # (event_socket.conf.xml.tmpl -> acl.conf.xml) 172.16.0.0/12'yi
        # beyaz listeye aliyor; bu subnet'i sabitlemek o kuralin her
        # ortamda gercekten calismasini garantiliyor.
        - subnet: 172.30.0.0/16
